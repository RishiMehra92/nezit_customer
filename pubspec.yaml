  pdfrx: ^2.4.7
  dart_pusher_channels: ^1.3.1
  uuid: ^4.6.0
  youtube_player_flutter: ^10.0.1
  video_player: ^2.10.1
  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  http: ^1.6.0
  sign_in_with_apple: ^8.1.0
  fast_cached_network_image: ^1.3.3+5
  webview_flutter: ^4.13.0
  file_picker: ^13.0.0
  freezed_annotation: ^3.1.0
  flutter_phoenix: ^1.1.1
  sms_autofill: ^2.3.0
  pin_code_fields: ^10.0.0
  app_links: ^7.0.0
  share_plus: ^13.1.0
  easy_stepper: ^1.0.1
  package_info_plus: ^10.1.0
  get_it: ^9.2.1
  build_runner: ^2.4.13
  animated_theme_switcher: ^2.0.10
  visibility_detector: ^0.4.0+2
  flutter_http_inspector:
    git:
      url: https://github.com/InfinitieParasgiri/flutter_http_inspector.git
  flutter_svg: ^2.3.0
  syncfusion_flutter_datepicker: ^34.1.31
  flutter_staggered_animations_plus: ^1.0.2
  hugeicons: ^1.1.7
  flutter_staggered_grid_view: ^0.7.0
  nested_scroll_view_plus: ^3.1.0
  firebase_analytics: ^12.1.2
  dismissible_page: 1.0.2
  hero_container: 1.0.2
  youtube_explode_dart: ^3.1.0
  upgrader: ^13.7.0
  clarity_flutter: ^1.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

dependency_overrides:
  device_info_plus: 13.2.0
  html: 0.15.6

flutter_launcher_icons:
  android: true       # Use 'true' to keep the standard 'ic_launcher' name
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_launcher_logo/launcher_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/payment-logos/
    - assets/images/wallet/
    - assets/images/app_logos/
    - assets/images/empty-states/
    - assets/animations/
    - assets/sounds/
    - assets/
    - assets/fonts/
    - assets/fonts/Figtree/
    - assets/fonts/Figtree/static/
    - assets/images/app_launcher_logo/
    - assets/svg/
    - assets/fonts/Lexend_Deca/
    - assets/fonts/Lexend_Deca/static/
    - assets/static_reel_image/

  fonts:
    - family: Figtree
      fonts:
          - asset: assets/fonts/Figtree/static/Figtree-Light.ttf
            weight: 300
          - asset: assets/fonts/Figtree/static/Figtree-Regular.ttf
            weight: 400
          - asset: assets/fonts/Figtree/static/Figtree-Medium.ttf
            weight: 500
          - asset: assets/fonts/Figtree/static/Figtree-SemiBold.ttf
            weight: 600
          - asset: assets/fonts/Figtree/static/Figtree-Bold.ttf
            weight: 700
          - asset: assets/fonts/Figtree/static/Figtree-ExtraBold.ttf
            weight: 800
          - asset: assets/fonts/Figtree/static/Figtree-Black.ttf
            weight: 900
