  flutter_stripe: ^14.0.0
  pay_with_paystack: ^1.0.14
  firebase_core: ^4.14.0
  firebase_messaging: ^16.1.1
  firebase_auth: ^6.1.4
  flutter_local_notifications: ^22.0.1
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.0.0
  speech_to_text: ^7.3.0
